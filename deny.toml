# cargo-deny configuration — permissive by design: flag advisories and
# unmaintained crates; licenses and sources stay informational for now.
[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"

[licenses]
unlicensed = "warn"
allow = ["MIT", "Apache-2.0", "ISC", "Unicode-3.0", "BSD-3-Clause", "0BSD"]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
