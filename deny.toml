# cargo-deny configuration — minimal and permissive: flag advisories and
# yanked crates; licenses and sources stay informational for now.
[advisories]
yanked = "warn"

[licenses]
allow = ["MIT", "Apache-2.0", "ISC", "Unicode-3.0", "BSD-3-Clause", "0BSD"]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
