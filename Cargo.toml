[package]
name = "leantime-mcp"
version = "2.7.0"
edition = "2021"
rust-version = "1.88"
description = "Unofficial Model Context Protocol server for Leantime: 42 agent-first tools, backup/restore, dry-run validation"
license = "MIT"
repository = "https://github.com/4lador/leantime-mcp"
readme = "README.md"
keywords = ["leantime", "mcp", "project-management"]
categories = ["command-line-utilities", "development-tools"]

# Distribution-channel files stay out of the crate tarball (the docs/*.md
# guides ship with the crate so relative links work on crates.io; only the
# hero image is excluded).
exclude = [
    "docs/hero.png",
    ".github/**",
    "docker-compose.yml",
    "scripts/**",
    "install.sh",
    "install.ps1",
]

# The installed binary keeps its short name (leantmcp) — harness configs
# point at ~/.local/bin/leantmcp and must never break on a rename.
[lib]
name = "leantmcp"

[[bin]]
name = "leantmcp"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = "4"
rpassword = "7"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2.0.20"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["net"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
