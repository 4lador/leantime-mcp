[package]
name = "leantmcp"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
description = "Model Context Protocol server for Leantime"
license = "MIT"
repository = "https://github.com/4lador/leantime-mcp"
readme = "README.md"
keywords = ["leantime", "mcp", "model-context-protocol"]
categories = ["command-line-utilities"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = "4"
rpassword = "7"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2.0.20"

[dev-dependencies]
mockito = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
