name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: leantmcp-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: leantmcp-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: leantmcp-darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: leantmcp-darwin-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: leantmcp-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        shell: bash
        run: |
          deno compile \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            --target ${{ matrix.target }} \
            --output ${{ matrix.artifact }} \
            src/main.ts

      - name: Checksum
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            HASH="$(powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 '${{ matrix.artifact }}').Hash.ToLower()")"
          else
            HASH="$(sha256sum '${{ matrix.artifact }}' | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$HASH" "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          cat "${{ matrix.artifact }}.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
