name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Run tests
        run: cargo test
      - name: Version check
        run: ./target/release/leantmcp --version
      - name: Keyring flow
        run: |
          export LEANTIME_API_KEY="lt_ci_dummy_key_0123456789abcdef"
          ./target/release/leantmcp key set
          ./target/release/leantmcp key show | grep -q "lt_ci"
      - name: URL flow
        run: |
          ./target/release/leantmcp url set https://ci-instance.leantime.test
          ./target/release/leantmcp url show | grep -q "ci-instance"
      - name: MCP handshake smoke test
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | \
            ./target/release/leantmcp serve 2>/dev/null | grep -q 'leantime-mcp'

  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
      - name: Version check
        run: ./target/release/leantmcp.exe --version
      - name: Keyring flow
        shell: pwsh
        run: |
          $env:LEANTIME_API_KEY = "lt_ci_dummy_key_0123456789abcdef"
          & ./target/release/leantmcp.exe key set
          $output = & ./target/release/leantmcp.exe key show
          if ($output -notmatch "lt_ci") { throw "key show failed" }
      - name: URL flow
        shell: pwsh
        run: |
          & ./target/release/leantmcp.exe url set https://ci-instance.leantime.test
          $shown = & ./target/release/leantmcp.exe url show
          if ($shown -notmatch "ci-instance") { throw "url show failed" }
      - name: MCP handshake (assert the response actually matches)
        shell: pwsh
        run: |
          $resp = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | & ./target/release/leantmcp.exe serve 2>$null
          if (-not ($resp | Select-String 'leantime-mcp')) { throw "handshake failed" }

  smoke-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
      - name: Version check
        run: ./target/release/leantmcp --version
      - name: Keyring flow
        run: |
          export LEANTIME_API_KEY="lt_ci_dummy_key_0123456789abcdef"
          ./target/release/leantmcp key set
          ./target/release/leantmcp key show | grep -q "lt_ci"
      - name: URL flow
        run: |
          ./target/release/leantmcp url set https://ci-instance.leantime.test
          ./target/release/leantmcp url show | grep -q "ci-instance"
      - name: MCP handshake smoke test
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | \
            ./target/release/leantmcp serve 2>/dev/null | grep -q 'leantime-mcp'

  msrv:
    # Verify the declared rust-version actually builds (committed Cargo.lock
    # makes this reproducible — transitive deps keep raising their MSRVs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check at MSRV
        run: cargo check --all-targets --locked

  local-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Run unit tests (e2e gate is opt-in below)
        run: cargo test
      - name: Start Leantime (docker compose)
        run: docker compose up -d
      - name: Bootstrap instance
        run: set -o pipefail && bash scripts/local-instance-bootstrap.sh | tail -1 > /tmp/key
      - name: Smoke e2e (binary-level MCP checks)
        run: |
          export LEANTIME_URL=http://localhost:8090
          export LEANTIME_API_KEY="$(cat /tmp/key)"
          bash tests/e2e/run.sh
      - name: Exhaustive e2e (full tool surface, destructive gating, cleanup)
        run: |
          export LEANTIME_URL=http://localhost:8090
          export LEANTIME_API_KEY="$(cat /tmp/key)"
          export LEANTIME_E2E=local
          cargo test --test e2e_local -- --nocapture --test-threads=1
      - name: Teardown
        if: always()
        run: docker compose down -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, smoke-windows, smoke-macos, msrv, local-e2e]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: leantmcp-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: leantmcp-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: leantmcp-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: leantmcp-darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: leantmcp-darwin-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package + checksum
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/leantmcp" "${{ matrix.artifact }}" 2>/dev/null \
            || cp "target/${{ matrix.target }}/release/leantmcp.exe" "${{ matrix.artifact }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            h=$(pwsh -Command "(Get-FileHash -Algorithm SHA256 '${{ matrix.artifact }}').Hash.ToLower()")
            echo "$h  ${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
          cat "${{ matrix.artifact }}.sha256"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  # Publishes metadata after the binaries: crates.io (trusted publishing,
  # keyless OIDC — configured on the crate's Trusted Publisher page for
  # workflow ci.yml) then the MCP Registry (github-oidc, keyless).
  # Runs only on version tags, after every other job — including release —
  # so a failed publish never leaves half-built artifacts behind.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, smoke-windows, smoke-macos, msrv, local-e2e, release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for crates.io trusted publishing + registry
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency guard
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag version: $VERSION"
          # Cargo.toml must match the tag
          CARGO_VER=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CARGO_VER" != "$VERSION" ]; then
            echo "::error::Cargo.toml ($CARGO_VER) != tag ($VERSION) — bump versions before tagging"
            exit 1
          fi
          # server.json (top-level + package entry) must match the tag
          SERVER_VER=$(jq -r '.version' server.json)
          PKG_VER=$(jq -r '.packages[0].version' server.json)
          if [ "$SERVER_VER" != "$VERSION" ] || [ "$PKG_VER" != "$VERSION" ]; then
            echo "::error::server.json (top=$SERVER_VER, package=$PKG_VER) != tag ($VERSION)"
            exit 1
          fi
          echo "Versions consistent: $VERSION"
      - name: Idempotency guard (crates.io)
        id: already_published
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -A "leantime-mcp-ci" "https://crates.io/api/v1/crates/leantime-mcp/$VERSION")
          if [ "$CODE" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "leantime-mcp@$VERSION already on crates.io — skipping cargo publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.already_published.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.already_published.outputs.skip != 'true'
      - name: Publish crate to crates.io (keyless)
        if: steps.already_published.outputs.skip != 'true'
        run: cargo publish --locked
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry (OIDC, keyless)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json to MCP Registry
        run: ./mcp-publisher publish
      - name: Verify registry listing
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for i in 1 2 3 4 5; do
            if curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=leantime-mcp" \
              | jq -e --arg v "$VERSION" '[.servers[].server.version] | index($v)' >/dev/null; then
              echo "Registry lists $VERSION ✓"
              exit 0
            fi
            echo "Version not visible yet (attempt $i) — waiting 20s…"
            sleep 20
          done
          echo "::warning::Registry listing did not show $VERSION within 100s (indexing lag?) — verify manually"
