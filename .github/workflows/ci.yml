name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Unit & integration tests
        run: deno task test:unit

  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Unit & integration tests (Windows runtime)
        run: deno task test:unit
      - name: Compile native Windows binary
        run: deno compile --allow-net --allow-env --allow-read --allow-write --output leantmcp.exe src/main.ts
      - name: Version check
        run: ./leantmcp.exe --version
      - name: "Key flow — chmod regression guard on Windows"
        run: |
          $env:LEANTIME_API_KEY = "lt_ci_dummy_key_0123456789abcdef"
          ./leantmcp.exe key set
          ./leantmcp.exe key show
        shell: pwsh
      - name: "URL flow — url set + url show"
        run: |
          ./leantmcp.exe url set https://ci-instance.leantime.test
          ./leantmcp.exe url show
        shell: pwsh
      - name: MCP handshake smoke test
        run: deno run --allow-run --allow-env scripts/smoke.ts
        env:
          LEANTMCP_BIN: ./leantmcp.exe

  local-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Unit & integration tests
        run: deno task test:unit
      - name: Start local Leantime (docker compose, 10 req/min — real default)
        run: docker compose up -d
      - name: Bootstrap instance + exhaustive e2e
        run: |
          export LEANTIME_E2E=local LEANTIME_URL=http://localhost:8090
          export LEANTIME_API_KEY="$(bash scripts/local-instance-bootstrap.sh | tail -1)"
          deno task test:e2e:local
      - name: Tear down
        if: always()
        run: docker compose down -v
